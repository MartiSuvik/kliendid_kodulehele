      gtag('set', 'ads_data_redaction', true);

    <!-- Meta Pixel Code — eager by design, mirroring the previous Google Ads tag. -->
    <script>

    <!-- Silktide cookie consent manager — CSS + brand overrides load eagerly (the
         stylesheet is small), so the banner is always styled correctly. Only the
         heavier JS is deferred to idle/interaction by the loader at end of <body>.
         Order matters: the main CSS must come BEFORE the override <style> below so
         our brand variables win the cascade. -->
    <link rel="stylesheet" id="silktide-consent-manager-css" href="https://cdn.jsdelivr.net/gh/silktide/consent-manager@v2.0.0/silktide-consent-manager.css" integrity="sha384-IO1E/jCrQXyH5rwcI0SXP7OXw47JFqQNDQcKhbFvqnL2IunBxxwE2Ne5XyAmCqKs" crossorigin="anonymous">

</head>
  <body class="bg-background-light text-gray-900 antialiased selection:bg-primary/20 selection:text-primary">

  <!-- Deferred third-party loader — ContentSquare, Silktide consent manager and the ElevenLabs widget load
       on the first browser-idle window or the first user interaction, whichever
       comes first, so they stay off the critical render path. The Meta Pixel and
       Microsoft Clarity remain eager (in <head>) by design. -->
  <script>
  (function () {
    var fired = false;
    var events = ["pointerdown", "keydown", "touchstart", "scroll"];
    function cleanup() { events.forEach(function (e) { window.removeEventListener(e, trigger); }); }
    function trigger() {
      if (fired) return;
      fired = true;
      cleanup();
      loadDeferred();
    }

    function loadDeferred() {
      // ContentSquare (heaviest main-thread contributor — must not block load).
      var cs = document.createElement("script");
      cs.src = "https://t.contentsquare.net/uxa/c3781148570ab.js";
      cs.async = true;
      document.head.appendChild(cs);

      // Silktide consent manager JS (its CSS is already loaded eagerly in <head>,
      // so the banner renders correctly styled). Init once the script is ready.
      var sk = document.createElement("script");
      sk.src = "https://cdn.jsdelivr.net/gh/silktide/consent-manager@v2.0.0/silktide-consent-manager.js";
      sk.integrity = "sha384-j4NIMOecmtzMWe9GJADIIe5hTlHG63aiTQ/2XorW10RNyQJg+IU+xwFVDy45wBah";
      sk.crossOrigin = "anonymous";
      sk.onload = initSilktide;
      document.head.appendChild(sk);

      // ElevenLabs Conversational AI widget (upgrades <elevenlabs-convai> in <body>).
      var el = document.createElement("script");
      el.src = "https://unpkg.com/@elevenlabs/convai-widget-embed";
      el.async = true;
      el.type = "text/javascript";
      document.body.appendChild(el);
    }

    function initSilktide() {
      window.silktideConsentManager.init({
        backdrop: {
          show: true
        },
        icon: {
          position: "bottomRight"
        },
        prompt: {
          position: "bottomRight"
        },
        consentTypes: [
          {
            id: "essential",
            label: "Essential",
            description: "<p>These cookies are necessary for the website to function properly and cannot be switched off. They help with things like logging in and setting your privacy preferences.</p>",
            required: true,
            onAccept: function() {
              console.log('Add logic for the required Essential consent type here');
            }
          },
          {
            id: "analytics",
            label: "Analytics",
            description: "<p>These cookies help us improve the site by tracking which pages are most popular and how visitors move around the site.</p>",
            required: false,
            gtag: [
              "ad_storage",
              "ad_user_data",
              "ad_personalization",
              "analytics_storage"
            ],
            scripts: [
              {
                url: "https://www.googletagmanager.com/gtm.js?id=GTM-PS6PTLG5",
                load: "async"
              }
            ],
            onAccept: function() {
              // Google Tag Manager (GTM-PS6PTLG5)
              window.dataLayer = window.dataLayer || [];
              window.dataLayer.push({ 'gtm.start': new Date().getTime(), event: 'gtm.js' });
            }
          },
          {
            id: "turundus",
            label: "Turundus",
            description: "<p>Neid küpsiseid kasutame meie ja meie reklaamipartnerid, et kuvada teile sellel saidil ja mujal asjakohaseid reklaame ning mõõta nende kampaaniate toimivust.</p>",
            required: false,
            gtag: [
              "ad_storage",
              "ad_user_data",
              "ad_personalization"
            ]
          }
        ],
        text: {
          prompt: {
            description: "<p>Kasutame oma saidil küpsiseid teie kasutuskogemuse parandamiseks, isikupärastatud sisu pakkumiseks ja liikluse analüüsimiseks.</p>",
            acceptAllButtonText: "Nõustu kõigiga",
            acceptAllButtonAccessibleLabel: "Nõustu kõigiga",
            rejectNonEssentialButtonText: "Lükka tagasi vabatahtlikud",
            rejectNonEssentialButtonAccessibleLabel: "Lükka tagasi kõik vabatahtlikud",
            preferencesButtonText: "Eelistused",
            preferencesButtonAccessibleLabel: "Eelistused"
          },
          preferences: {
            title: "Kohandage oma küpsiste eelistusi",
            description: "<p>Austame teie õigust privaatsusele. Võite valida, et ei luba teatud tüüpi küpsiseid. Teie küpsiste eelistused kehtivad kogu meie veebilehel.</p>",
            saveButtonText: "Salvesta ja sulge",
            saveButtonAccessibleLabel: "Salvestage oma küpsiste eelistused",
            creditLinkText: "Hankige see bänner tasuta",
            creditLinkAccessibleLabel: "Hankige see bänner tasuta"
          }
        }
      });
    }

    events.forEach(function (e) { window.addEventListener(e, trigger, { once: true, passive: true }); });
    if (window.requestIdleCallback) window.requestIdleCallback(trigger, { timeout: 2000 });
    else window.setTimeout(trigger, 2000);
  })();
  </script>

  <script type="module" src="/src/main.tsx"></script>

</body>
